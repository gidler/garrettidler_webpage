      e.stopPropagation();
      startDifficulty(game.level);
    });
    changeDifficultyBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      showHome();
    });
    renderer.domElement.addEventListener("click", function () {
      if (!input.locked) requestLock();
    });
    // shooting on mouse down while locked
    renderer.domElement.addEventListener("mousedown", function () {
      if (!input.locked || consumeLevelTransitionInput()) return;
      tryFire();
    });

    document.addEventListener("pointerlockchange", function () {
      input.locked = document.pointerLockElement === renderer.domElement;
      if (!input.locked) clearInputState();
      hideOverlayIfPlaying();
    });

    document.addEventListener("mousemove", function (e) {
      if (!input.locked) return;
      input.mouseDX += e.movementX || 0;
      input.mouseDY += e.movementY || 0;
    });

    window.addEventListener("keydown", function (e) {
      if (!input.locked && !difficultyPicker.hidden && /^[1-4]$/.test(e.key)) {
        e.preventDefault();
        startDifficulty(Number(e.key) + 1);
        return;
      }
      if (input.locked && e.code === "Space") {
        e.preventDefault();
        if (!e.repeat && !consumeLevelTransitionInput()) tryFire();
        return;
      }
      if (input.locked) input.keys[e.code] = true;
      if (input.locked && ["KeyW", "KeyA", "KeyS", "KeyD"].includes(e.code)) {
        consumeLevelTransitionInput();
      }
    });
    window.addEventListener("keyup", function (e) { input.keys[e.code] = false; });
    window.addEventListener("blur", clearInputState);

    function tryFire() {
      if (canPlay() && input.fireTimer <= 0) {
        fire();
        input.fireTimer = CONFIG.fireCooldown;
      }
    }

    window.addEventListener("resize", function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateParticleViewportScale();
    });

    // ---------------------------------------------------------------------
    // HUD
    // ---------------------------------------------------------------------
    const el = {
      level: document.getElementById("level"),
      accuracyBonus: document.getElementById("accuracyBonus"),
      accuracyBonusValue: document.getElementById("accuracyBonusValue"),
      targetCarton: document.getElementById("targetCarton"),
      chargeMeter: document.getElementById("chargeMeter"),
      chargeBars: Array.from(document.querySelectorAll(".chargeBar")),
    };
    function markHUDDirty() {
      ui.hudDirty = true;
    }
    function formatLevelTime(seconds) {
      const wholeSeconds = Math.floor(seconds);
      const minutes = Math.floor(wholeSeconds / 60);
      const hundredths = Math.floor((seconds - wholeSeconds) * 100);
      return minutes + ":" + String(wholeSeconds % 60).padStart(2, "0") + "." + String(hundredths).padStart(2, "0");
    }
    function beginLevelResult(level) {
      const result = { level, time: 0, shots: 0, hits: 0, accuracyBonus: 0, completed: false };
      game.currentLevelResult = result;
      game.levelResults.push(result);
    }
    function finishCurrentLevel(completed) {
      const result = game.currentLevelResult;
      if (!result) return;
      result.time = game.levelTime;
      result.completed = completed;
    }
    function calculateScore(result) {
      const misses = Math.max(0, result.shots - result.hits);
      result.misses = misses;
      return Math.max(0, Math.round(100000 / Math.max(0.01, result.time)) + result.accuracyBonus);
    }
    function loadBestScores() {
      try {
        const saved = JSON.parse(localStorage.getItem(BEST_SCORE_STORAGE_KEY));
        return saved && typeof saved === "object" ? saved : {};
      } catch (e) {
        return {};
      }
    }
    function saveBestScore(level, score) {
      const bests = loadBestScores();
      const previous = Number(bests[level]) || 0;
      if (score <= previous) return false;
      bests[level] = score;
      try { localStorage.setItem(BEST_SCORE_STORAGE_KEY, JSON.stringify(bests)); }
      catch (e) { /* A completed run remains valid if storage is unavailable. */ }
      return true;
    }
    function renderLevelResults() {
      levelResults.replaceChildren();
      const result = game.currentLevelResult;
      if (!result) return;
      const accuracy = result.shots ? Math.round((result.hits / result.shots) * 100) : 0;
      const misses = Math.max(0, result.shots - result.hits);
      const score = result.completed ? result.score : 0;
      const hero = document.createElement("div");
      hero.className = "scoreHero";
      hero.innerHTML = result.completed ?
        "<div class=\"scoreLabel\">Score</div>" +
        "<div class=\"scoreValue\">" + score.toLocaleString() + "</div>" +
        "<div class=\"scoreBest\">" + (result.isBest ? "★ New personal best" : "Personal best: " + result.bestScore.toLocaleString()) + "</div>" :
        "<div class=\"scoreValue\">FAILED</div>";
      levelResults.appendChild(hero);
      const breakdown = document.createElement("div");
      breakdown.className = "scoreBreakdown";
      breakdown.innerHTML =
        "<div class=\"scoreStat\"><span>Time</span><strong>" + formatLevelTime(result.time) + "</strong></div>" +
        "<div class=\"scoreStat\"><span>Accuracy</span><strong>" + accuracy + "%</strong></div>" +
        "<div class=\"scoreStat\"><span>Misses</span><strong>" + misses + "</strong></div>" +
        "<div class=\"scoreStat\"><span>Bonus</span><strong>" + (result.accuracyBonus > 0 ? "+" : "") + result.accuracyBonus + "</strong></div>";
      levelResults.appendChild(breakdown);
    }
    function buildTargetCarton() {
      el.targetCarton.replaceChildren();
      for (const target of levelTargets) {
        const dot = document.createElement("span");
        dot.className = "targetDot";
        dot.style.setProperty("--target-color", "#" + target.mesh.material.color.getHexString());
        target.targetDot = dot;
        el.targetCarton.appendChild(dot);
      }
    }
    function updateHUD() {
      el.level.textContent = getDifficultyName(game.level) + " · " + formatLevelTime(game.levelTime);
      if (!ui.hudDirty) return;
      ui.hudDirty = false;
      const accuracyBonus = game.currentLevelResult ? game.currentLevelResult.accuracyBonus : 0;
      el.accuracyBonusValue.textContent = (accuracyBonus > 0 ? "+" : "") + accuracyBonus;
      const unlimitedBurst = game.burstUnlimitedTimer > 0;
      const burstActive = game.burstCharges > 0 || unlimitedBurst;
      const chargeCount = burstActive ? game.burstCharges : game.hitStreak;
      el.chargeMeter.classList.add("active");
      el.chargeMeter.classList.toggle("burst", burstActive);
      el.chargeMeter.classList.toggle("unlimited", unlimitedBurst);
      el.chargeMeter.setAttribute("aria-label", unlimitedBurst ? "Unlimited Burst" : burstActive ? "Burst charges" : "Hit streak");
      el.chargeMeter.setAttribute("aria-valuenow", chargeCount);
      el.chargeMeter.setAttribute("aria-valuetext", unlimitedBurst ? "Unlimited Burst active" : burstActive ? chargeCount + " Burst charges remaining" : chargeCount + " of 5 hit streak");
      el.chargeBars.forEach(function (bar, index) {
        bar.classList.toggle("filled", index < chargeCount);
      });
    }

    // Keep a handful of nearby off-screen targets discoverable without
    // crowding the display when later levels have many enemies.
    const enemyIndicatorLayer = document.getElementById("enemyIndicators");
    const maxEnemyIndicators = 5;
    const enemyIndicators = [];
    const indicatorCandidates = [];
    const _indicatorCameraSpace = new THREE.Vector3();
    const _indicatorNdc = new THREE.Vector3();
    const _indicatorTangent = new THREE.Vector3();
    for (let i = 0; i < maxEnemyIndicators; i++) {
      const indicator = document.createElement("div");
      indicator.className = "enemyIndicator";
      indicator.textContent = "▲";
      indicator.style.display = "none";
      enemyIndicatorLayer.appendChild(indicator);
      enemyIndicators.push(indicator);
    }

    function updateEnemyIndicators(isPlaying) {
      if (game.timeSinceLastKill >= CONFIG.indicatorRevealNoKillTime) {
        game.enemyIndicatorsUnlocked = true;
      }
      if (!isPlaying || !game.enemyIndicatorsUnlocked) {
        for (const indicator of enemyIndicators) indicator.style.display = "none";
        return;
      }

      indicatorCandidates.length = 0;
      for (const enemy of enemies) {
        _indicatorCameraSpace.copy(enemy.pos).applyMatrix4(camera.matrixWorldInverse);
        if (_indicatorCameraSpace.z < 0) {
          _indicatorNdc.copy(enemy.pos).project(camera);
          const onScreen = Math.abs(_indicatorNdc.x) < 0.82 && Math.abs(_indicatorNdc.y) < 0.82;
          if (
            onScreen &&
            isWithinSurfaceDistance(enemy.up, up, CONFIG.indicatorHideSurfaceDistance)
          ) continue;
        }

        enemy.indicatorDistance = enemy.pos.distanceToSquared(player.position);
        let insertAt = 0;
        while (
          insertAt < indicatorCandidates.length &&
          indicatorCandidates[insertAt].indicatorDistance <= enemy.indicatorDistance
        ) insertAt++;
        if (insertAt < maxEnemyIndicators) {
          indicatorCandidates.splice(insertAt, 0, enemy);
          if (indicatorCandidates.length > maxEnemyIndicators) indicatorCandidates.pop();
        }
      }

      const edgeX = Math.max(40, window.innerWidth / 2 - 46);
      const edgeY = Math.max(40, window.innerHeight / 2 - 46);
      for (let i = 0; i < enemyIndicators.length; i++) {
        const indicator = enemyIndicators[i];
        const enemy = indicatorCandidates[i];
        if (!enemy) {
          indicator.style.display = "none";
          continue;
        }

        // Use the target's direction along the planet surface, instead of
        // camera-space depth. A target ahead around the globe stays ahead.
        _indicatorTangent.copy(enemy.up).addScaledVector(up, -enemy.up.dot(up));
        let x = _indicatorTangent.dot(right);
        let y = -_indicatorTangent.dot(forward); // forward maps to screen-top
        if (_indicatorTangent.lengthSq() < 0.0001) {
          x = 0;
          y = -1;
        }

        const edgeScale = 1 / Math.max(Math.abs(x) / edgeX, Math.abs(y) / edgeY);
        const screenX = window.innerWidth / 2 + x * edgeScale;
        const screenY = window.innerHeight / 2 + y * edgeScale;
        const rotation = Math.atan2(y, x) * 180 / Math.PI + 90;
        indicator.style.display = "block";
        indicator.style.left = screenX + "px";
        indicator.style.top = screenY + "px";
        indicator.style.transform = "translate(-50%, -50%) rotate(" + rotation + "deg)";
        const color = "#" + enemy.mesh.material.color.getHexString();
        indicator.style.color = color;
        indicator.style.textShadow = "0 0 7px " + color + ", 0 0 16px " + color;
      }
    }
    startLevel(2, true);
    showHome();

    // ---------------------------------------------------------------------
    // PLAYER MOVEMENT (rolling on the sphere)
    // ---------------------------------------------------------------------
    const moveDir = new THREE.Vector3();
    const slideDir = new THREE.Vector3();
    const moveAxis = new THREE.Vector3();
    const candidatePos = new THREE.Vector3();
    const candidateUp = new THREE.Vector3();
    const spinQ = new THREE.Quaternion();

    function isBlockedByObstacle(nextUp, currentUp) {
      for (const obstacle of obstacles) {
        const minDistance = CONFIG.playerRadius * CONFIG.collisionPadding +
          obstacle.visualRadius * CONFIG.playerObstacleCollisionScale;
        if (!isWithinSurfaceDistance(nextUp, obstacle.up, minDistance)) continue;
        if (currentUp && !movedCloserToSurfacePoint(nextUp, currentUp, obstacle.up)) continue;
        return true;
      }
      return false;
    }

    function tryMoveAlong(tangentDir, dist) {
      if (tangentDir.lengthSq() <= 0.0001) return false;

      tangentDir.normalize();
      moveAxis.crossVectors(up, tangentDir).normalize();
      candidatePos.copy(player.position).applyAxisAngle(moveAxis, dist / R);
      candidateUp.copy(candidatePos).normalize();
      if (isBlockedByObstacle(candidateUp, up)) return false;

      player.position.copy(candidatePos);
      forward.applyAxisAngle(moveAxis, dist / R);
      spinQ.setFromAxisAngle(moveAxis, dist / CONFIG.playerRadius);
      player.quaternion.premultiply(spinQ);
      up.copy(candidateUp);
      return true;
    }

    function updatePlayer(dt) {
      // surface normal
      up.copy(player.position).normalize();

      // apply mouse yaw to the heading (rotate forward around up)
      if (input.mouseDX !== 0) {
        forward.applyAxisAngle(up, -input.mouseDX * CONFIG.mouseSensitivity);
      }
      view.pitch = THREE.MathUtils.clamp(
        view.pitch - input.mouseDY * CONFIG.mouseSensitivity,
        CONFIG.pitchMin,
        CONFIG.pitchMax
      );
      input.mouseDX = 0;
      input.mouseDY = 0;

      // keep forward tangent to the surface, rebuild right
      forward.addScaledVector(up, -forward.dot(up)).normalize();
      right.crossVectors(forward, up).normalize();

      // build movement direction from keys (relative to facing)
      moveDir.set(0, 0, 0);
      const forwardInput = (input.keys["KeyW"] ? 1 : 0) - (input.keys["KeyS"] ? 1 : 0);
      const rightInput = (input.keys["KeyD"] ? 1 : 0) - (input.keys["KeyA"] ? 1 : 0);
      if (forwardInput) moveDir.addScaledVector(forward, forwardInput);
      if (rightInput) moveDir.addScaledVector(right, rightInput);

      if (moveDir.lengthSq() > 0.0001) {
        moveDir.normalize();
        const dist = CONFIG.moveSpeed * dt;

        if (!tryMoveAlong(moveDir, dist) && forwardInput && rightInput) {
          slideDir.copy(forward).multiplyScalar(forwardInput);
          tryMoveAlong(slideDir, dist);

          right.crossVectors(forward, up).normalize();
          slideDir.copy(right).multiplyScalar(rightInput);
          tryMoveAlong(slideDir, dist);
        }
      }

      // pin exactly to the surface
      player.position.normalize().multiplyScalar(R + CONFIG.playerRadius);
      up.copy(player.position).normalize();
    }

    // ---------------------------------------------------------------------
    // CAMERA (third-person, behind & above, looking along aim)
    // ---------------------------------------------------------------------
    const camTarget = new THREE.Vector3();
    const desiredPos = new THREE.Vector3();

    function updateCamera(dt, snap) {
      // Keep the camera oriented around the local surface frame.
      right.crossVectors(forward, up).normalize();
      camForward.copy(forward).applyAxisAngle(right, view.pitch).normalize();

      desiredPos.copy(player.position)
        .addScaledVector(camForward, -CONFIG.camDistance)
        .addScaledVector(up, CONFIG.camHeight);

      // don't let the camera dip under the surface
      const minLen = R + 1.2;
      if (desiredPos.length() < minLen) desiredPos.normalize().multiplyScalar(minLen);

      if (snap) camera.position.copy(desiredPos);
      else camera.position.lerp(desiredPos, 1 - Math.pow(1 - CONFIG.camLerp, dt * 60));
      camera.up.copy(up);
      camTarget.copy(camera.position).add(camForward);
      camera.lookAt(camTarget);
      camera.updateMatrixWorld();
    }

    // Start outside the planet rather than letting the camera ease out from
    // Three.js's default origin at the center of the globe.
    updateCamera(0, true);

    // ---------------------------------------------------------------------
    // MAIN LOOP
    // ---------------------------------------------------------------------
    const timer = new THREE.Timer();
    timer.connect(document);
    function animate(timestamp) {
      requestAnimationFrame(animate);
      timer.update(timestamp);
      const dt = Math.min(timer.getDelta(), 0.05);

      if (game.transitionTimer > 0) {
        game.transitionTimer = Math.max(0, game.transitionTimer - dt);
        if (game.transitionTimer === 0) dismissLevelBanner();
      }
      const playing = canPlay();
      if (input.fireTimer > 0) input.fireTimer -= dt;

      if (game.burstUnlimitedTimer > 0) {
        game.burstUnlimitedTimer = Math.max(0, game.burstUnlimitedTimer - dt);
        if (game.burstUnlimitedTimer === 0) markHUDDirty();
      }

      if (playing) {
        game.levelTime += dt;
        game.timeSinceLastKill += dt;
        updatePlayer(dt);
        updateEnemies(dt);
        if (!game.dead) updateProjectiles(dt);
      }
      updateCamera(dt);
      updateEnemyIndicators(canPlay());
      updateEffects(dt);
      updateHUD();

      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
  })();
  </script>
</body>
</html>
